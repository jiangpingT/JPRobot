repos:
  # TruffleHog: detects secrets and credentials before push
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.88.1
    hooks:
      - id: trufflehog
        name: TruffleHog (secret scanner)
        entry: trufflehog git file://. --since-commit HEAD --only-verified --fail
        language: golang
        pass_filenames: false
        stages: [pre-push]

  # detect-secrets: lightweight pattern-based secret detection on commit
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (pattern scanner)
        args: ['--baseline', '.secrets.baseline']
        stages: [pre-commit]

  # Basic hygiene: no large files, no merge conflict markers
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
        name: detect private keys
